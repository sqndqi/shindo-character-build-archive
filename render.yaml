services:
  - type: web
    name: shindo-archive-server
    runtime: node
    rootDir: server
    buildCommand: >-
      npm install && npm run build &&
      ([ -z "$DATABASE_URL" ] || (npm run migrate:up && npm run seed))
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: OWNER_USERNAME
        sync: false
      - key: OWNER_PASSWORD_HASH
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: NOWPAYMENTS_API_KEY
        sync: false
      - key: NOWPAYMENTS_IPN_SECRET
        sync: false
      - key: NOWPAYMENTS_API_BASE_URL
        value: "https://api.nowpayments.io"
